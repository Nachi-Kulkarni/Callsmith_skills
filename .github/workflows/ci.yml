name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run callsmith test suite
        run: npm test

      - name: Verification CLI smoke
        run: |
          node bin/callsmith.mjs doctor
          node bin/callsmith.mjs contract validate --file examples/clinic-triage/callsmith.recipe.md --domain medical

      - name: Package manifest smoke
        run: npm pack --dry-run --json --cache /tmp/callsmith-npm-cache

  validate-packs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate all provider packs against schema
        run: |
          node bin/callsmith.mjs pack validate
          node bin/callsmith.mjs verify-packs
